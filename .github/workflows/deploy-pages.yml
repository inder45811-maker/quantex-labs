name: Deploy Quantex Labs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify source
        run: node scripts/verify-source.mjs
      - name: Build and verify Pages
        run: node scripts/build-github-pages.mjs
        env:
          QUANTEX_ORIGIN: ${{ steps.pages.outputs.origin }}
          QUANTEX_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
